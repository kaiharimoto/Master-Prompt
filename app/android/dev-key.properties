# Signing credentials for the throwaway development key.
#
# These are public by design — see the note in android/.gitignore. This key
# exists purely so that consecutive CI builds are signed identically, which is
# what lets a new dev build install over the old one without wiping saved data.
#
# NEVER use this key for a Play Store release.
storeFile=dev-keystore.jks
storePassword=masterprompt-dev
keyAlias=dev
keyPassword=masterprompt-dev

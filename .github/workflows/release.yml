name: Release

# Android and Windows ship together from one tag, so a version is never
# available on one platform and not the other. Day-to-day builds come from the
# rolling `dev` prerelease in ci.yml; this is for versioned milestones.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v0.1.0)'
        required: true

env:
  FLUTTER_VERSION: '3.47.2'

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - working-directory: packages/mp_core
        run: dart pub get && dart analyze && dart test
      - working-directory: packages/mp_runner
        run: dart pub get && dart analyze && dart test

  android:
    name: Android
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Signed with the committed dev key, exactly like the rolling dev builds,
      # so a tagged build installs over one without an uninstall. If this ever
      # goes to the Play Store it needs a fresh key kept out of the repository —
      # see the note in app/android/.gitignore.
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build apk --release \
            --dart-define=MP_BUILD=${{ github.run_number }} \
            --dart-define=MP_SHA=${{ github.sha }}
          flutter build appbundle --release \
            --dart-define=MP_BUILD=${{ github.run_number }} \
            --dart-define=MP_SHA=${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            app/build/app/outputs/flutter-apk/*.apk
            app/build/app/outputs/bundle/release/*.aab

  windows:
    name: Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release `
            --dart-define=MP_BUILD=${{ github.run_number }} `
            --dart-define=MP_SHA=${{ github.sha }}

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" `
            -DestinationPath "out/MasterPrompt-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.zip

  publish:
    name: Publish one release with both platforms
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/android/**/*.apk
            artifacts/android/**/*.aab
            artifacts/windows/*.zip

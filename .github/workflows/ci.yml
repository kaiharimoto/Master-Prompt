name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.2'
  # The fingerprint of app/android/dev-keystore.jks. Asserted after the APK is
  # built so a broken signing config fails loudly here rather than silently
  # producing a build that will not install over the previous one.
  DEV_KEY_SHA256: 'f54adad394476e384b7df179176617f89c87b3dadc977ce5abc600ef95d65acb'

jobs:
  core:
    name: Core (pure Dart)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No Flutter here on purpose. mp_core and mp_runner carry the logic that
      # has to be right during a long unattended run, and they are kept free of
      # Flutter so they can be analysed and tested in seconds without a 2.5 GB
      # SDK. If this job ever needs Flutter, that property has been lost.
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: mp_core
        working-directory: packages/mp_core
        run: |
          dart pub get
          dart analyze
          dart format --output=none --set-exit-if-changed .
          dart test --reporter expanded

      # Compiles and drives a fake `claude` binary, so limit detection and the
      # resume ladder are exercised without an API key and without waiting five
      # hours for a real usage limit.
      - name: mp_runner
        working-directory: packages/mp_runner
        run: |
          dart pub get
          dart analyze
          dart format --output=none --set-exit-if-changed .
          dart test --reporter expanded

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # mp_design was never analysed by any job: `flutter analyze` in app/ only
      # covers the app package, so an error in the design system reached the
      # device rather than CI.
      - name: Analyse the design system
        working-directory: packages/mp_design
        run: |
          flutter pub get
          flutter analyze

      - name: Resolve, analyse, test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build release APK
        working-directory: app
        run: |
          flutter build apk --release \
            --dart-define=MP_BUILD=${{ github.run_number }} \
            --dart-define=MP_SHA=${{ github.sha }}

      # The signing config is the single most failure-prone piece of this
      # pipeline, and getting it wrong is invisible until an install is refused
      # on the device. Assert the certificate instead of trusting it.
      - name: Verify the APK is signed with the dev key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          echo "using $APKSIGNER"
          APK=app/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          ACTUAL=$(grep -i 'SHA-256 digest' /tmp/certs.txt | head -1 | awk '{print $NF}' | tr 'A-Z' 'a-z')
          echo "expected $DEV_KEY_SHA256"
          echo "actual   $ACTUAL"
          if [ "$ACTUAL" != "$DEV_KEY_SHA256" ]; then
            echo "::error::APK is not signed with the committed dev key. New builds would refuse to install over the previous one."
            exit 1
          fi

      - name: Name the artifact
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/app-release.apk \
             "out/MasterPrompt-${{ github.run_number }}-$(echo ${{ github.sha }} | cut -c1-7).apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk
          retention-days: 14

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # This job built and shipped without running a single test, while the
      # Android job ran analyze and the full suite. A Windows-only regression
      # had nothing standing between it and the release page.
      - name: Resolve, analyse, test
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      # The build number has to reach the exe's VERSIONINFO, not just the Dart
      # side, or Windows sees every build as 0.1.0.1 and an installer cannot
      # tell an upgrade from a reinstall. Flutter derives that resource from
      # pubspec's `version:`, so that is what gets stamped.
      - name: Stamp the build number into the version
        shell: pwsh
        run: |
          $p = "app/pubspec.yaml"
          (Get-Content $p) -replace '^version: .*$', `
            'version: 0.1.0+${{ github.run_number }}' | Set-Content $p
          Select-String -Path $p -Pattern '^version:'

      # The only place a Windows binary can be produced — Flutter desktop needs
      # a Windows host. This is why the runner logic lives in a plain dart:io
      # package that is proven on Linux first.
      - name: Build release
        working-directory: app
        run: |
          flutter build windows --release `
            --dart-define=MP_BUILD=${{ github.run_number }} `
            --dart-define=MP_SHA=${{ github.sha }}

      # Checked rather than assumed. The runner image very likely ships Inno
      # Setup, and "very likely" is what put an invalid session id on a user's
      # machine this week.
      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC not present; installing."
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe still not at $iscc" }
          Write-Host "using $iscc"
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build the installer
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          New-Item -ItemType Directory -Force -Path out | Out-Null
          & "$env:ISCC" `
            "/DAppVersion=0.1.0.${{ github.run_number }}" `
            "/DBuildDir=..\..\build\windows\x64\runner\Release" `
            "/DOutputDir=..\..\..\out" `
            "/DOutputBase=MasterPromptSetup-${{ github.run_number }}-$sha" `
            "app\windows\installer\master_prompt.iss"
          Get-ChildItem out

      # The zip keeps shipping for now. The copy a user is running today knows
      # only that filename, so dropping it would strand them reporting "no
      # asset" forever, never learning an installer exists. One cycle later it
      # can go.
      - name: Package portable zip
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0,7)
          Compress-Archive -Path "app/build/windows/x64/runner/Release/*" `
            -DestinationPath "out/MasterPrompt-windows-x64-${{ github.run_number }}-$sha.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            out/*.exe
            out/*.zip
          retention-days: 14

  publish-dev:
    name: Publish the rolling dev build
    needs: [core, android, windows]
    # Real pushes only — a pull request must not move the build everyone is
    # installing from.
    #
    # The default branch is the usual answer, and the development branch is
    # named alongside it because that is where the work actually lands: with
    # only the default-branch clause, every commit on a branch built green,
    # skipped this job, and published nothing, so an installed copy checked at
    # launch, correctly found the same build it was already running, and said
    # "you are on the newest build" for a week. The updater was not broken;
    # nothing was reaching it.
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       github.ref == 'refs/heads/claude/zen-ride-jgmc8m')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Assets carry their build number so a downloaded file is identifiable
      # later, which means a new build adds files rather than replacing them.
      # Without this the page accumulates every build and you have to work out
      # which APK is newest — the exact guessing the release notes promise you
      # will not have to do.
      - name: Remove the previous build's assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api "repos/${{ github.repository }}/releases/tags/dev" \
                  --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do
            echo "removing asset $id"
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id" || true
          done

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest development build
          target_commitish: ${{ github.sha }}
          prerelease: true
          make_latest: false
          # Replaced wholesale each time, so the page never shows two builds and
          # leaves you guessing which one you installed.
          body: |
            The newest build from the default branch. This tag always points at
            the most recent green commit, so this page is worth bookmarking —
            the link never changes.

            | | |
            |---|---|
            | Build | `${{ github.run_number }}` |
            | Commit | [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
            | Built | ${{ github.event.head_commit.timestamp }} |

            **Android** — download the `.apk` and open it. The first time,
            Android will ask you to allow installs from your browser. Later
            builds install straight over this one and keep your saved missions,
            because every build is signed with the same key.

            After that you should not need this page: the app checks here at
            launch and offers the newer build from its own menu.

            **Windows** — download `MasterPromptSetup-*.exe` and run it. It
            installs for you only, so there is no administrator prompt, and it
            adds a Start-menu entry and an uninstaller like any other program.
            SmartScreen will warn that the publisher is unknown, because the
            installer is unsigned: choose *More info* then *Run anyway*.

            After that, updates are one click from inside the app — it closes,
            updates and reopens itself. The `.zip` is still published for
            anyone who wants a portable copy, or who installed before the
            installer existed.

            Found something wrong? Open Settings, tap **Copy diagnostics**, and
            paste that into the chat.
          files: |
            artifacts/android/*.apk
            artifacts/windows/*.exe
            artifacts/windows/*.zip
